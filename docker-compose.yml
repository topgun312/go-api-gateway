services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateway}
      POSTGRES_DB: ${POSTGRES_DB:-gateway}
    ports:
      - "5432:5432"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d   # schema.sql выполнится при ПЕРВОМ старте
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gateway} -d ${POSTGRES_DB:-gateway}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"

  app:
    build: .
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: ${SERVER_PORT:-:8080}
      DB_DSN: ${DB_DSN:-postgres://gateway:gateway@localhost:5432/gateway?sslmode=disable}
      REDIS_ADDR: ${REDIS_ADDR:-localhost:6379}
      OLLAMA_URL: ${OLLAMA_URL:-http://localhost:11434}
      MAX_REQUESTS: ${MAX_REQUESTS:-5}